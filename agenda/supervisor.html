<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel do Supervisor · Agenda Técnica</title>
<meta name="theme-color" content="#002B49">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=1">
<style>.troca-app{background:#002B49;border-top:1px solid rgba(255,255,255,.12)}.troca-app .troca-wrap{display:flex;gap:6px;padding-block:8px}.troca-app a{flex:1;text-align:center;padding:9px 8px;border-radius:999px;color:#FFFFFF;background:rgba(255,255,255,.10);font:700 13.5px "Montserrat",Arial,sans-serif;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.troca-app a[aria-current="page"]{background:#66D3CD;color:#002B49}.troca-app a:focus-visible{outline:3px solid #66D3CD;outline-offset:2px}</style>
</head>
<body>
<header class="band">
  <div class="wrap wide">
    <div class="logo"><img src="../logo.png" alt="ECTAS Saneamento"></div>
    <div class="apptitle"><h1>Painel do Supervisor</h1><p>Agenda Técnica</p></div>
    <button type="button" class="btn-top" id="b-atualizar" hidden>Atualizar</button>
    <button type="button" class="btn-top" id="b-sair" hidden>Sair</button>
  </div>
  <div class="stripe"></div>
</header>
<nav class="troca-app" aria-label="Escolher aplicativo"><div class="wrap wide troca-wrap"><a href="../supervisor.html">Diário de Obra</a><a href="../ferramentas/supervisor.html">Controle de Ferramentas</a><a href="supervisor.html" aria-current="page">Agenda Técnica</a></div></nav>

<div class="wrap" id="v-login">
  <form class="login" id="f-login">
    <h2>Entrar no painel</h2>
    <p class="mini" style="margin:0">Use a mesma senha do Painel do Diário de Obra.</p>
    <label>Senha do painel<input id="senha" type="password" autocomplete="current-password"></label>
    <button type="submit" class="btn primary big" id="b-entrar">Entrar</button>
    <div class="msg" id="msg-login" role="status"></div>
    <p class="mini" style="margin:0">Esqueceu a senha? Use "Esqueci minha senha" no Painel do Diário de Obra: vale para os três aplicativos.</p>
  </form>
</div>

<nav class="tabs" id="nav" hidden><div class="wrap wide" role="tablist">
  <button role="tab" data-tab="agenda" aria-selected="true">Agenda</button>
  <button role="tab" data-tab="hoje" aria-selected="false">Onde está a equipe</button>
  <button role="tab" data-tab="lanc" aria-selected="false">Lançamentos</button>
  <button role="tab" data-tab="pend" aria-selected="false">Obras em espera</button>
  <button role="tab" data-tab="cad" aria-selected="false">Cadastros</button>
</div></nav>

<main class="wrap wide" id="main" hidden></main>
<div id="modalroot"></div>
<div id="toast" class="toast" hidden></div>
<footer class="rod wrap"><span id="versao"></span></footer>

<script src="config.js?v=1"></script>
<script src="comum.js?v=1"></script>
<script src="supervisor.js?v=1" defer></script>
</body>
</html>
